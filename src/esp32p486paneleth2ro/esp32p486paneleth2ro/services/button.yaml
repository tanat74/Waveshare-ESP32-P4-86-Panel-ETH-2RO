binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35
      inverted: true   # Кнопка BOOT: нажата = LOW
      mode:
        input: true
        pullup: true
    id: boot_button
    name: "Boot Button"
    filters:
      - delayed_on: 10ms   # Антидребезг
    on_click:
      - min_length: 0ms
        max_length: 500ms
        then:
          # Короткое нажатие: запустить/остановить голосового ассистента
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - voice_assistant.stop:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: speaker_media_player
                          then:
                            - media_player.stop:
                                announcement: true
                                id: speaker_media_player
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: speaker_media_player
                          then:
                            - media_player.stop:
                                announcement: true
                                id: speaker_media_player
                          else:
                            - if:
                                condition:
                                  switch.is_on: voice_assistant_enabled
                                then:
                                  - light.turn_on: display_backlight
                                  - lvgl.resume:
                                  - lvgl.page.show: voice_assistant_page
                                  - voice_assistant.start:
                                      silence_detection: true
      - min_length: 1000ms
        max_length: 5000ms
        then:
          # Долгое нажатие: включить/выключить подсветку
          - light.toggle: display_backlight
